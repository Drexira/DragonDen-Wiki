<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0d10">
    <style>
        html, body { background:#0b0d10; color:#e6e8eb }
    </style>
    <script>
        (function () {
            var PAGES = ['home','about','mods','euphoria','neonsigns','weightsraidtimer','thezonemaker','questimmersion', 'devtool'];

            var segs  = location.pathname.replace(/\/+/g,'/').split('/').filter(Boolean);
            var first = segs[0] || '';
            var base  = '/' + (PAGES.includes(first) ? '' : first);
            var slug  = (segs.slice().reverse().map(s => s.replace(/\.html?$/i,''))
                .find(s => PAGES.includes(s))) || 'home';

            location.replace(base + '/#' + slug + location.search);
        })();
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page not found • Dragon Den</title>
    <link rel="icon" type="image/x-icon" href="res/favicon.ico" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
<div class="center-viewport">
    <div class="card-404">
        <h1>404</h1>
        <p>The bitcoins you're looking for is in another castle :-(</p>

        <p class="hint">Requested: <code id="pathInfo"></code></p>

        <p>
            <a id="backHome" class="btn-small is-primary" href="#">Go to Home</a>
        </p>
    </div>
</div>

<script>
    (function(){
        const base = window.__DD_BASE || '/';
        document.getElementById('pathInfo').textContent = location.pathname + location.search + location.hash;
        document.getElementById('backHome').addEventListener('click', function(e){
            e.preventDefault();
            location.href = base;
        });
    })();
</script>
</body>
</html>
