<script>
    (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var base = '/' + (parts[0] || '');
        var leaf = parts[parts.length - 1] || '';
        var prev = parts[parts.length - 2] || '';
        var candidate = leaf || prev;
        var page = (candidate.replace(/\.html?$/i, '') || 'home');
        if (window === window.top && !document.getElementById('content')) {
            location.replace(base + '/#' + page);
        }
    })();
</script>
<section class="content-section scan">
    <h2 onclick="showContent('mods')">
        <span class="title-grad">Dragon Den - Mods</span>
    </h2>

    <section>
        <section class="mods">
            <br>
            <div id="mods-own" class="mod-container"></div>
        </section>
        <br>
        <h2 class="seperator"></h2>
        <section class="mods-alt">
            <h3 style="color: var(--brand-2)">
                <span class="title-grad">Mods I've updated or helped with</span>
            </h3>
            <div id="mods-helped" class="other-mods"></div>
        </section>
    </section>
</section>
